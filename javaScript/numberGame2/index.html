<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />

    <!-- <style>
      #intro {
        display: none !important;
      }
    </style> -->
  </head>
  <body>
    <!-- intro -->
    <div id="intro">
      <div class="intro_wrap">
        <h2>공주님 구출하기</h2>
        <p>성에 갇혀있는 공주님을 구출하세요!</p>
        <a href="#game" class="start">START</a>
      </div>
    </div>

    <!-- game -->
    <div id="game">
      <div class="wrap">
        <div class="top">
          <div class="tt">
            <a href="#intro" class="home"><h3>< HOME</h3></a>
            <div id="chance">
              CHANCE :
              <ul class="heart">
                <li>♥</li>
                <li>♥</li>
                <li>♥</li>
                <li>♥</li>
                <li>♥</li>
              </ul>
            </div>
          </div>
          <div class="td">
            <div class="img_ani">
              <img class="pic1" src="img/11.jpg" alt="" />
              <img class="pic2" src="img/22.jpg" alt="" />
            </div>
          </div>
        </div>
        <div class="bottom">
          <div id="result">용이 오기 전에 공주를 구출하라</div>
          <div class="write">
            <input
              id="user"
              placeholder="층 수를 입력하세요 (1~100)"
              onkeypress="
                if (event.keyCode == 13) {
                  play();
                }
              "
            />
            <span class="floor">층</span>
            <button id="play">GO!</button>
            <button id="reset">RETRY</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="custom.js"></script>
  </body>
</html>

<!-- 

1. html요소 가지고 오기
result,chance,user,play,result

2. random 수 만들기 (1~100까지의 수)
random(함수안에만들기)

3. play라는 함수를 만들어서 사용자가 입력한 값을 가지고 옴

4. 시작버튼 클릭했을때 play함수 호출

5. play함수 안에 입력받은 수와 컴퓨터 수 비교해서 up/down/bingo에 해당하는 이미지  변경시킴

6. up/down/bingo에 해당하는 이미지 변경시킴

7. 1보다 작고 100보다 크면 1부터 100까지의 숫자를 입력하세요 메세지가 나오게 함.

8. chance 1씩 감소시키고 남은 찬스 몇개라고 출력.
chance가 1보다 작으면 시작버튼 비활성화
chance 자리에 gameover라는 글자 출력

9. 숫자 입력하고 enter를 누르면 play() 함수로 가게 함

10. user를 focus하면 기존 숫자 삭제

-->
